<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Max AI Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

  :root {
    --bg-main: #07041a;
    --bg-gradient-1: #7b5cff33;
    --bg-gradient-2: #38b6ff33;
    --bg-gradient-3: #87ceeb22;
    --chat-bg: rgba(14,8,40, 0.45);
    --chat-border: rgba(150,110,255, 0.25);
    --chat-glow-1: rgba(123,44,240, 0.3);
    --chat-glow-2: rgba(90,30,200, 0.2);
    --header-bg-1: rgba(123,44,240,0.15);
    --header-bg-2: rgba(90,30,200,0.15);
    --text-primary: #ffffff;
    --text-secondary: #cccccc;
    --text-muted: #888888;
    --bot-bg-1: rgba(123,44,240,0.15);
    --bot-bg-2: rgba(56,182,255,0.15);
    --bot-border: rgba(123,44,240,0.3);
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(150,110,255,0.2);
    --panel-bg: rgba(14,8,40, 0.95);

    --online-color: #15dd0e;
    --online-dot: #15dd0e;
    --online-glow: rgba(23,233,16, 0.8);
  }

  body.light-mode {
    --bg-main: #eef5ff;
    --bg-gradient-1: #7b2cf022;
    --bg-gradient-2: #38b6ff22;
    --bg-gradient-3: #87ceeb33;
    --chat-bg: rgba(255,255,255, 0.55);
    --chat-border: rgba(110,40,200, 0.25);
    --chat-glow-1: rgba(123,44,240, 0.2);
    --chat-glow-2: rgba(90,30,200, 0.15);
    --header-bg-1: rgba(123,44,240,0.1);
    --header-bg-2: rgba(90,30,200,0.1);
    --text-primary: #1a0a45;
    --text-secondary: #3a3a6c;
    --text-muted: #7788bb;
    --bot-bg-1: rgba(123,44,240,0.12);
    --bot-bg-2: rgba(56,182,255,0.12);
    --bot-border: rgba(110,40,200,0.3);
    --input-bg: rgba(255,255,255,0.7);
    --input-border: rgba(130,110,255,0.3);
    --panel-bg: rgba(255,255,255, 0.95);

    --online-color: #15dd0e;
    --online-dot: #15dd0e;
    --online-glow: rgba(23,233,16, 0.8);
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg-main);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    transition: background 0.5s ease;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 30%, var(--bg-gradient-1), transparent 50%),
                radial-gradient(circle at 80% 70%, var(--bg-gradient-2), transparent 50%),
                radial-gradient(circle at 50% 50%, var(--bg-gradient-3), transparent 60%);
    animation: bgMove 12s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes bgMove {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.2) rotate(10deg); }
  }

  #canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .chat-wrapper {
    position: relative;
    z-index: 2;
    width: 420px;
    height: 640px;
    max-width: 95vw;
    max-height: 95vh;
    background: var(--chat-bg);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-radius: 24px;
    border: 1px solid var(--chat-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 60px var(--chat-glow-1),
                0 0 120px var(--chat-glow-2);
    animation: floaty 5s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .chat-header {
    padding: 14px 18px;
    background: linear-gradient(90deg, var(--header-bg-1), var(--header-bg-2));
    color: var(--text-primary);
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--chat-border);
    position: relative;
    flex-shrink: 0;
    z-index: 3;
  }

  .robot-3d {
    width: 50px;
    height: 50px;
    position: relative;
    flex-shrink: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(123,44,240,0.25), rgba(56,182,255,0.15));
    box-shadow: 0 0 20px rgba(123,44,240,0.5),
                0 0 40px rgba(56,182,255,0.3);
    overflow: hidden;
  }

  .robot-3d canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    border-radius: 50%;
  }

  .header-info h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #8cf3ee;
    text-shadow: 0 0 10px rgba(140,200,255, 0.8),
                 0 0 20px rgba(123,44,240,0.6),
                 0 0 30px rgba(135,206,250,0.4);
    animation: nameGlow 3s ease-in-out infinite;
    line-height: 1.1;
  }

  @keyframes nameGlow {
    0%, 100% {
      text-shadow: 0 0 10px rgba(140,200,255, 0.8),
                   0 0 20px rgba(123,44,240,0.7),
                   0 0 30px rgba(135,206,250,0.5);
    }
    50% {
      text-shadow: 0 0 15px rgba(140,200,255, 0.8),
                   0 0 25px rgba(135,206,250,0.9),
                   0 0 40px rgba(123,44,240,0.6);
    }
  }

  .header-info p {
    font-size: 11px;
    color: var(--online-color);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 3px;
  }

  .dot {
    width: 7px; height: 7px;
    background: var(--online-dot);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--online-glow);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
  }

  .icon-btn:hover {
    background: rgba(123,44,240,0.3);
    transform: scale(1.1);
  }

  .chat-body {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
    position: relative;
    z-index: 3;
  }

  .chat-body::-webkit-scrollbar { width: 6px; }
  .chat-body::-webkit-scrollbar-track { background: transparent; }
  .chat-body::-webkit-scrollbar-thumb {
    background: linear-gradient(#7b2cf0, #38b6ff);
    border-radius: 3px;
  }

  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    color: var(--text-primary);
    position: relative;
    will-change: transform, opacity;
    backface-visibility: hidden;
    transform: translateZ(0);
  }

  .user {
    background: linear-gradient(135deg, #7b2cf0, #38b6ff);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 20px rgba(123,44,240,0.4);
    animation: userMsgIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes userMsgIn {
    0% { opacity: 0; transform: translate3d(30px, 20px, 0) scale(0.92); }
    40% { opacity: 1; }
    100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  .bot {
    background: linear-gradient(135deg, var(--bot-bg-1), var(--bot-bg-2));
    align-self: flex-start;
    border: 1px solid var(--bot-border);
    border-bottom-left-radius: 4px;
    animation: botMsgIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes botMsgIn {
    0% { opacity: 0; transform: translate3d(-30px, 20px, 0) scale(0.92); }
    40% { opacity: 1; }
    100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  .user::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    animation: userGlow 1.2s ease-out;
  }

  @keyframes userGlow {
    0% { box-shadow: 0 0 0 0 rgba(123,44,240,0.5); }
    100% { box-shadow: 0 0 0 20px rgba(123,44,240,0); }
  }

  .bot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    animation: botGlow 1.2s ease-out;
  }

  @keyframes botGlow {
    0% { box-shadow: 0 0 0 0 rgba(56,182,255,0.5); }
    100% { box-shadow: 0 0 0 20px rgba(56,182,255,0); }
  }

  .typing {
    display: flex;
    gap: 5px;
    padding: 14px 18px;
    background: rgba(123,44,240,0.1);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    align-self: flex-start;
    border: 1px solid var(--bot-border);
    animation: typingIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes typingIn {
    0% { opacity: 0; transform: translate3d(-20px, 10px, 0) scale(0.9); }
    100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  .typing span {
    width: 8px; height: 8px;
    background: linear-gradient(135deg, #7b2cf0, #38b6ff);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out;
    box-shadow: 0 0 8px rgba(123,44,240,0.5);
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
    30% { transform: translateY(-10px) scale(1.15); opacity: 1; }
  }

  .chat-input {
    display: flex;
    padding: 14px;
    background: rgba(0,0,0,0.35);
    gap: 8px;
    border-top: 1px solid var(--chat-border);
    flex-shrink: 0;
    position: relative;
    z-index: 3;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    align-items: center;
  }

  body.light-mode .chat-input {
    background: rgba(255,255,255,0.4);
  }

  .chat-input input {
    flex: 1;
    padding: 14px 18px;
    border: 1px solid var(--input-border);
    border-radius: 25px;
    background: var(--input-bg);
    color: var(--text-primary);
    outline: none;
    font-size: 14px;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    min-width: 0;
  }

  .chat-input input:focus {
    border-color: #7b2cf0;
    box-shadow: 0 0 15px rgba(123,44,240,0.4);
    transform: scale(1.01);
  }

  .chat-input input::placeholder { color: var(--text-muted); }

  .emoji-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .emoji-btn:hover {
    background: rgba(123,44,240,0.25);
    transform: scale(1.1) rotate(15deg);
  }

  .emoji-btn:active { transform: scale(0.9); }

  .send-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #7b2cf0, #38b6ff);
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 20px rgba(123,44,240,0.4);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .send-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(123,44,240,0.8);
  }

  .send-btn:active { transform: scale(0.9); }

  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .send-btn.clicked {
    animation: sendPulse 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes sendPulse {
    0% { transform: scale(1); box-shadow: 0 0 20px rgba(123,44,240,0.4); }
    50% { transform: scale(1.15); box-shadow: 0 0 40px rgba(123,44,240,1), 0 0 60px rgba(56,182,255,0.8); }
    100% { transform: scale(1); box-shadow: 0 0 20px rgba(123,44,240,0.4); }
  }

  .emoji-picker {
    position: absolute;
    bottom: 80px;
    right: 14px;
    width: 300px;
    max-height: 260px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--chat-border);
    border-radius: 16px;
    padding: 12px;
    display: none;
    z-index: 20;
    box-shadow: 0 0 40px var(--chat-glow-1);
    overflow: hidden;
  }

  .emoji-picker.active {
    display: block;
    animation: emojiIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes emojiIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji-picker h4 {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    padding-left: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    max-height: 200px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .emoji-grid::-webkit-scrollbar { width: 4px; }
  .emoji-grid::-webkit-scrollbar-thumb {
    background: linear-gradient(#7b2cf0, #38b6ff);
    border-radius: 2px;
  }

  .emoji-item {
    font-size: 22px;
    padding: 6px 0;
    text-align: center;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
  }

  .emoji-item:hover {
    background: rgba(123,44,240,0.2);
    transform: scale(1.25) translateY(-2px);
  }

  .emoji-item:active { transform: scale(0.95); }

  .settings-panel {
    position: absolute;
    top: 75px; right: 18px;
    left: 18px;
    max-width: 320px;
    margin-left: auto;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    border: 1px solid var(--chat-border);
    padding: 16px;
    display: none;
    z-index: 10;
    box-shadow: 0 0 40px var(--chat-glow-1);
  }

  .settings-panel.active {
    display: block;
    animation: panelIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes panelIn {
    0% { opacity: 0; transform: translateY(-15px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .settings-panel h3 {
    color: var(--text-primary);
    font-size: 14px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #7b2cf0, #87ceeb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .settings-panel label {
    display: block;
    color: var(--text-secondary);
    font-size: 12px;
    margin-bottom: 6px;
    margin-top: 10px;
  }

  .settings-panel select,
  .settings-panel input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
  }

  .settings-panel select option {
    background: #1a0a45;
    color: #fff;
  }

  .save-btn {
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #7b2cf0, #38b6ff);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }

  @media (max-width: 500px) {
    body { padding: 0; }

    .chat-wrapper {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 0;
      animation: none;
      border: none;
      background: rgba(14,8,40, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    body.light-mode .chat-wrapper {
      background: rgba(255,255,255, 0.9);
    }

    .chat-header {
      padding: 12px 14px;
      padding-top: max(12px, env(safe-area-inset-top));
    }

    .robot-3d { width: 44px; height: 44px; }
    .header-info h2 { font-size: 20px; }
    .header-info p { font-size: 10px; }
    .icon-btn { width: 32px; height: 32px; font-size: 14px; }

    .chat-body { padding: 14px; gap: 10px; }
    .msg { font-size: 13.5px; padding: 10px 14px; max-width: 82%; }

    .chat-input {
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      gap: 6px;
    }

    .chat-input input { padding: 12px 16px; font-size: 14px; }
    .emoji-btn { width: 38px; height: 38px; font-size: 18px; }
    .send-btn { width: 38px; height: 38px; font-size: 15px; }

    .emoji-picker {
      width: calc(100vw - 20px);
      left: 10px;
      right: 10px;
      bottom: 75px;
    }

    .settings-panel {
      top: 65px;
      left: 10px;
      right: 10px;
    }
  }

  @media (min-width: 501px) and (max-width: 900px) {
    .chat-wrapper { width: 380px; height: 600px; }
  }

  @media (max-height: 600px) {
    .chat-wrapper { height: 95vh; max-height: 95vh; }
  }

  /* ===== MOBILE SMOOTHNESS FIXES ===== */
  .chat-body { overscroll-behavior: contain; }
  .chat-input input { font-size: 16px; }
  @media (max-width: 500px) {
    #canvas-container { display: none; }
    body::before { animation: none; }
    .chat-wrapper {
      height: 100vh; height: 100dvh;
      max-height: 100vh; max-height: 100dvh;
      backdrop-filter: none; -webkit-backdrop-filter: none;
      background: rgba(14,8,40,0.96);
    }
    body.light-mode .chat-wrapper { background: rgba(238,245,255,0.97); }
    html, body { height: 100vh; height: 100dvh; }
    .chat-input { backdrop-filter: none; -webkit-backdrop-filter: none; }
    .settings-panel, .emoji-picker { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--panel-bg); }
    .msg { will-change: auto; backface-visibility: visible; max-width: 85%; }
    .user::after, .bot::after { display: none; }
    .header-info h2 { animation: none; }
    .chat-input input:focus { transform: none; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="chat-wrapper">
  <div class="chat-header">
    <div class="robot-3d" id="robotAvatar"></div>
    <div class="header-info">
      <h2>MAX AI</h2>
      <p><span class="dot"></span> Online</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" onclick="toggleSettings()">⚙</button>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <h3>⚙ AI Configuration</h3>
    <label>AI Provider:</label>
    <select id="provider" onchange="updateModelOptions()">
      <option value="deepseek">DeepSeek</option>
      <option value="gemini">Google Gemini</option>
      <option value="dummy">Demo (No API)</option>
    </select>
    <label>API Key:</label>
    <input type="password" id="apiKey" placeholder="Paste your API key..." />
    <label>Model:</label>
    <select id="model"></select>
    <button class="save-btn" onclick="saveSettings()">Save Settings</button>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="msg bot">Hi! Naan <b>Max</b> 🤖<br>Enna help venum sollunga!</div>
  </div>

  <div class="emoji-picker" id="emojiPicker">
    <h4>😊 Emojis</h4>
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>

  <div class="chat-input">
    <button class="emoji-btn" onclick="toggleEmoji()" title="Emojis">😊</button>
    <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
    <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================
   CONFIG

function animateBg() {
  requestAnimationFrame(animateBg);
  if(window.innerWidth <= 500 || document.hidden) return;
  bgTime += 0.01;

  bgParticles.rotation.y += 0.0003;
  bgParticles.rotation.x += 0.00015;
  particleMat.opacity = 0.5 + Math.sin(bgTime * 0.8) * 0.15;

  bigRobot.position.y = Math.sin(bgTime * 0.8) * 0.15;
  bigRobot.rotation.y = Math.sin(bgTime * 0.4) * 0.4;

  ball.scale.setScalar(1 + Math.sin(bgTime * 3) * 0.15);
  ballGlow.scale.setScalar(1 + Math.sin(bgTime * 3) * 0.2);
  ballGlow.material.opacity = 0.4 + Math.sin(bgTime * 3) * 0.15;

  eyeMat.color.setHSL(0.55, 1, 0.5 + Math.sin(bgTime * 2.5) * 0.1);
  haloMat.opacity = 0.4 + Math.sin(bgTime * 2.5) * 0.15;

  pinkLight.position.x = Math.cos(bgTime * 0.5) * 8;
  pinkLight.position.z = Math.sin(bgTime * 0.5) * 8 + 4;
  blueLight.position.x = Math.sin(bgTime * 0.5) * 8;
  blueLight.position.z = Math.cos(bgTime * 0.5) * 8 + 4;

  blinkTimer += 0.01;
  if(!isBlinking && blinkTimer > 3 + Math.random() * 2) {
    isBlinking = true; blinkTimer = 0; blinkProgress = 0;
  }
  if(isBlinking) {
    blinkProgress += 0.12;
    const blinkAmount = Math.sin(blinkProgress * Math.PI);
    const scaleY = Math.max(0.05, 1 - blinkAmount);
    eyeL.scale.y = scaleY; eyeR.scale.y = scaleY;
    haloL.scale.y = scaleY; haloR.scale.y = scaleY;
    if(blinkProgress >= 1) {
      isBlinking = false;
      eyeL.scale.y = 1; eyeR.scale.y = 1;
      haloL.scale.y = 1; haloR.scale.y = 1;
    }
  }

  bgRenderer.render(bgScene, bgCamera);
}

/* CHAT */
const chatBody = document.getElementById('chatBody');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const history = [];   // conversation memory: {role:'user'|'assistant', content:'...'}
let busy = false;

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// AI reply ku safe formatting: **bold**, `code`, new lines
function formatReply(s) {
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function sendMsg() {
  const text = userInput.value.trim();
  if(!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  sendBtn.classList.add('clicked');
  setTimeout(() => sendBtn.classList.remove('clicked'), 600);

  document.getElementById('emojiPicker').classList.remove('active');

  addMsg(escapeHtml(text), 'user');
  userInput.value = '';
  const typingEl = showTyping();

  getAIReply(text).then(reply => {
    typingEl.remove();
    if(!reply) reply = '(empty reply vandhuchu 🤔)';
    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: reply });
    if(history.length > 20) history.splice(0, history.length - 20); // last 10 turns mattum
    addMsg(formatReply(reply), 'bot');
  }).catch(err => {
    typingEl.remove();
    addMsg('⚠ <b>Error:</b> ' + escapeHtml(err.message || err), 'bot');
  }).finally(() => {
    busy = false;
    sendBtn.disabled = false;
    userInput.focus();
  });
}

function addMsg(html, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = html;
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
  return div;
}

async function getAIReply(userMsg) {
  if(settings.provider === 'dummy') return await getDummyReply(userMsg);
  if(!settings.apiKey || settings.apiKey.startsWith('PASTE_YOUR')) {
    throw new Error('API key illa. ⚙ Settings la key paste pannunga (illa na Demo mode select pannunga).');
  }
  if(settings.provider === 'deepseek') return await callDeepSeek(userMsg);
  if(settings.provider === 'gemini') return await callGemini(userMsg);
  throw new Error('Unknown provider: ' + settings.provider);
}

/* DEEPSEEK API CALL */
async function callDeepSeek(userMsg) {
  // FIX: model DeepSeek model ah irukkanum (gpt-* illa)
  let model = settings.model;
  if(!/^deepseek-/.test(model)) model = 'deepseek-chat';

  try {
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + settings.apiKey
      },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...history,
          { role: 'user', content: userMsg }
        ],
        temperature: 0.8,
        max_tokens: 800,
        stream: false
      })
    });

    if(!res.ok) {
      const err = await res.json().catch(() => ({}));
      let msg = err.error?.message || `HTTP ${res.status} ${res.statusText}`;
      if(res.status === 401) msg = 'API key thappu (401). Key sariya paste pannirukeengala nu check pannunga.';
      if(res.status === 402) msg = 'DeepSeek balance illa (402). Platform la top-up pannunga.';
      if(res.status === 429) msg = 'Romba requests (429). Konjam neram kazhichu try pannunga.';
      throw new Error(msg);
    }

    const data = await res.json();
    return data.choices?.[0]?.message?.content || '';
  } catch(e) {
    if(e instanceof TypeError || (e.message && e.message.includes('Failed to fetch'))) {
      throw new Error('Network issue. Internet check pannunga.');
    }
    throw e;
  }
}

/* GEMINI API CALL */
async function callGemini(userMsg) {
  let model = settings.model;
  if(!/^gemini-/.test(model)) model = 'gemini-3.1-flash-lite';

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(settings.apiKey)}`;
  const contents = history.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  contents.push({ role: 'user', parts: [{ text: userMsg }] });

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: contents
    })
  });

  if(!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'Gemini failed');
  }

  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

function getDummyReply(msg) {
  return new Promise(resolve => {
    setTimeout(() => {
      const m = msg.toLowerCase();
      let reply;
      if(m.includes('hi') || m.includes('hello') || m.includes('hai')) reply = 'Hello! 👋 Naan Max. Eppadi irukeenga?';
      else if(m.includes('name')) reply = 'En peru **Max** 🤖';
      else if(m.includes('help')) reply = 'Kandippa! Enna help venum?';
      else reply = 'Interesting! Innum sollunga... 🤔';
      resolve(reply);
    }, 500 + Math.random() * 700);
  });
}

userInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendMsg(); }
});

sendBtn.addEventListener('mousedown', (e) => e.preventDefault());

function scrollBottom() { chatBody.scrollTop = chatBody.scrollHeight; }
userInput.addEventListener('focus', () => setTimeout(scrollBottom, 300));
if(window.visualViewport) window.visualViewport.addEventListener('resize', scrollBottom);
